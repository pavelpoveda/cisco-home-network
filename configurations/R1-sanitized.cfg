!
! Cisco C1111-8P R1 — IOS XE 17.3
! Sanitized reference based on running configuration, October 20, 2026
! PUBLIC DOCUMENTATION ONLY — NOT A DEPLOYABLE BACKUP.
! Authentication hashes, PKI, serial numbers, hardware identifiers,
! licensing/call-home data removed. ACL remark clutter omitted.
!
version 17.3
service timestamps debug datetime msec
service timestamps log datetime msec localtime
hostname R1
!
! Administrative username and enable secret omitted.
no aaa new-model
clock timezone EST -5 0
clock summer-time EDT recurring
!
ip name-server 1.1.1.1 1.0.0.1
ip domain name home.arpa
ip dhcp excluded-address 192.168.20.1 192.168.20.49
ip dhcp excluded-address 192.168.40.1 192.168.40.49
ip dhcp excluded-address 192.168.20.50
!
ip dhcp pool CLIENTS
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 1.1.1.1 1.0.0.1
 lease 7
!
ip dhcp pool GUEST
 network 192.168.40.0 255.255.255.0
 default-router 192.168.40.1
 dns-server 1.1.1.1 1.0.0.1
!
ip dhcp pool WINDOWS-PC
 host 192.168.20.50 255.255.255.0
 ! MAC-derived client-identifier intentionally omitted.
 default-router 192.168.20.1
 dns-server 1.1.1.1 1.0.0.1
!
login on-success log
!
! PKI, licensing, and call-home sections omitted.
!
interface GigabitEthernet0/0/0
 description WAN-TO-ATT-GATEWAY
 ip address dhcp
 ip nat outside
 negotiation auto
!
interface GigabitEthernet0/0/1
 description TRUNK-TO-SW1
 no ip address
 negotiation auto
!
interface GigabitEthernet0/0/1.10
 description MANAGEMENT-GATEWAY
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
 ip nat inside
!
interface GigabitEthernet0/0/1.20
 description CLIENTS-GATEWAY
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
 ip nat inside
 ip access-group CLIENTS-IN in
!
interface GigabitEthernet0/0/1.30
 description SERVERS-GATEWAY
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
 ip nat inside
!
interface GigabitEthernet0/0/1.40
 description GUEST-GATEWAY
 encapsulation dot1Q 40
 ip address 192.168.40.1 255.255.255.0
 ip nat inside
 ip access-group GUEST-IN in
!
interface GigabitEthernet0/1/0
 description UNUSED-DISABLED
 shutdown
!
interface GigabitEthernet0/1/1
 description UNUSED-DISABLED
 shutdown
!
interface GigabitEthernet0/1/2
 description UNUSED-DISABLED
 shutdown
!
interface GigabitEthernet0/1/3
 description UNUSED-DISABLED
 shutdown
!
interface GigabitEthernet0/1/4
 description UNUSED-DISABLED
 shutdown
!
interface GigabitEthernet0/1/5
 description UNUSED-DISABLED
 shutdown
!
interface GigabitEthernet0/1/6
 description UNUSED-DISABLED
 shutdown
!
interface GigabitEthernet0/1/7
 description UNUSED-DISABLED
 shutdown
!
interface Vlan1
 no ip address
!
no ip http server
ip http authentication local
no ip http secure-server
ip forward-protocol nd
ip nat inside source list NAT_NETWORKS interface GigabitEthernet0/0/0 overload
ip ssh version 2
!
ip access-list standard NAT_NETWORKS
 10 permit 192.168.10.0 0.0.0.255
 20 permit 192.168.20.0 0.0.0.255
 30 permit 192.168.30.0 0.0.0.255
 40 permit 192.168.40.0 0.0.0.255
!
ip access-list standard SSH-MANAGEMENT
 10 remark Trusted administrative devices
 10 permit 192.168.20.50
 20 permit 192.168.10.0 0.0.0.255
 30 deny any log
!
ip access-list extended CLIENTS-IN
 20 permit tcp host 192.168.20.50 host 192.168.30.10 eq 22
 40 deny ip 192.168.20.0 0.0.0.255 192.168.30.0 0.0.0.255
 60 permit ip any any
!
ip access-list extended GUEST-IN
 10 permit udp any eq bootpc host 255.255.255.255 eq bootps
 20 permit udp any eq bootpc host 192.168.40.1 eq bootps
 30 deny ip 192.168.40.0 0.0.0.255 10.0.0.0 0.255.255.255
 40 deny ip 192.168.40.0 0.0.0.255 172.16.0.0 0.15.255.255
 50 deny ip 192.168.40.0 0.0.0.255 192.168.0.0 0.0.255.255
 70 permit ip 192.168.40.0 0.0.0.255 any
!
control-plane
!
line con 0
 exec-timeout 15 0
 logging synchronous
 login local
 transport input none
 stopbits 1
!
line vty 0 4
 access-class SSH-MANAGEMENT in
 login local
 transport input ssh
!
line vty 5 15
 access-class SSH-MANAGEMENT in
 login local
 transport input ssh
!
ntp server time.google.com prefer
ntp server time.cloudflare.com
!
! Operational notes:
! CLIENTS-IN admin SSH/internet successful; non-admin deny untested.
! GUEST-IN configured; guest functionality user-tested, evidence not captured.
! These ACLs are stateless IPv4 policies, not a comprehensive firewall.
end
