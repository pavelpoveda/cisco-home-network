!
! Cisco Catalyst WS-C3560CX-12PC-S SW1 — IOS 15.2
! Sanitized reference based on running configuration, October 20, 2026
! PUBLIC DOCUMENTATION ONLY — NOT A DEPLOYABLE BACKUP.
! Authentication hashes, PKI certificates and identifiers omitted.
! VLAN inventory is documented separately; running config did not include VLAN blocks.
!
version 15.2
no service pad
service timestamps debug datetime msec
service timestamps log datetime msec localtime
no service password-encryption
hostname SW1
!
! Administrative username and enable secret omitted.
no aaa new-model
clock timezone EST -5 0
clock summer-time EDT recurring
system mtu routing 1500
!
ip arp inspection vlan 20,40
ip dhcp snooping vlan 20,40
no ip dhcp snooping information option
ip dhcp snooping
no ip domain-lookup
ip domain-name home.arpa
!
! PKI trustpoint and certificate chain omitted.
spanning-tree mode rapid-pvst
spanning-tree extend system-id
vlan internal allocation policy ascending
!
! VLAN inventory observed using show vlan brief:
! 10 MANAGEMENT: Gi0/14
! 20 CLIENTS: Gi0/1-4
! 30 SERVERS: Gi0/5-6
! 40 GUEST: Gi0/7-8
! 999 UNUSED: Gi0/9-12 shutdown
! 1 default: Gi0/15-16 shutdown
!
interface GigabitEthernet0/1
 description CLIENT-DEVICE
 switchport access vlan 20
 switchport mode access
 spanning-tree portfast edge
 spanning-tree bpduguard enable
!
interface GigabitEthernet0/2
 description CLIENT-DEVICE
 switchport access vlan 20
 switchport mode access
 spanning-tree portfast edge
 spanning-tree bpduguard enable
!
interface GigabitEthernet0/3
 description CLIENT-DEVICE
 switchport access vlan 20
 switchport mode access
 spanning-tree portfast edge
 spanning-tree bpduguard enable
!
interface GigabitEthernet0/4
 description CLIENT-DEVICE
 switchport access vlan 20
 switchport mode access
 spanning-tree portfast edge
 spanning-tree bpduguard enable
!
interface GigabitEthernet0/5
 description SERVER-DEVICE
 switchport access vlan 30
 switchport mode access
 spanning-tree portfast edge
 spanning-tree bpduguard enable
!
interface GigabitEthernet0/6
 description SERVER-DEVICE
 switchport access vlan 30
 switchport mode access
 spanning-tree portfast edge
 spanning-tree bpduguard enable
!
interface GigabitEthernet0/7
 description GUEST-DEVICE
 switchport access vlan 40
 switchport mode access
 spanning-tree portfast edge
 spanning-tree bpduguard enable
!
interface GigabitEthernet0/8
 description GUEST-DEVICE
 switchport access vlan 40
 switchport mode access
 spanning-tree portfast edge
 spanning-tree bpduguard enable
!
interface GigabitEthernet0/9
 description UNUSED
 switchport access vlan 999
 switchport mode access
 shutdown
!
interface GigabitEthernet0/10
 description UNUSED
 switchport access vlan 999
 switchport mode access
 shutdown
!
interface GigabitEthernet0/11
 description UNUSED
 switchport access vlan 999
 switchport mode access
 shutdown
!
interface GigabitEthernet0/12
 description UNUSED
 switchport access vlan 999
 switchport mode access
 shutdown
!
interface GigabitEthernet0/13
 description TRUNK-TO-R1
 switchport trunk allowed vlan 10,20,30,40
 switchport mode trunk
 switchport nonegotiate
 ip arp inspection trust
 ip dhcp snooping trust
!
interface GigabitEthernet0/14
 description MANAGEMENT-PC
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast edge
 spanning-tree bpduguard enable
!
interface GigabitEthernet0/15
 description UNUSED-SFP
 shutdown
!
interface GigabitEthernet0/16
 description UNUSED-SFP
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan10
 description SWITCH-MANAGEMENT
 ip address 192.168.10.2 255.255.255.0
!
ip default-gateway 192.168.10.1
ip forward-protocol nd
no ip http server
no ip http secure-server
ip ssh version 2
!
ip access-list standard SSH-MANAGEMENT
 remark Trusted administrative devices
 permit 192.168.20.50
 permit 192.168.10.0 0.0.0.255
 deny any log
!
line con 0
 exec-timeout 15 0
 logging synchronous
 login local
!
line vty 0 4
 access-class SSH-MANAGEMENT in
 logging synchronous
 login local
 transport input ssh
!
line vty 5 15
 access-class SSH-MANAGEMENT in
 logging synchronous
 login local
 transport input ssh
!
ntp server 192.168.10.1 prefer
!
! Operational notes:
! DHCP snooping is enabled on VLANs 20 and 40; VLAN 20 binding observed.
! DAI is configured on VLANs 20 and 40; VLAN 20 forwarded ARP observed.
! VLAN 40 post-DAI validation is pending.
! DHCP snooping database persistence across a switch reboot is not verified.
end
